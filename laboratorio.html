/** Bus de eventos: mediador desacoplado entre módulos. */
class EventBus {
  constructor() { this.listeners = new Map(); }
  on(evt, cb) {
    if (!this.listeners.has(evt)) this.listeners.set(evt, new Set());
    this.listeners.get(evt).add(cb);
    return () => this.off(evt, cb);
  }
  off(evt, cb) { if (this.listeners.has(evt)) this.listeners.get(evt).delete(cb); }
  emit(evt, payload) {
    const cbs = this.listeners.get(evt);
    if (cbs) cbs.forEach(cb => { try { cb(payload); } catch (e) { console.error(e); } });
  }
}

/** Longitud de onda (nm) → RGB aproximado (Dan Bruton 1996). */
function wavelengthToRGB(nm) {
  let R = 0, G = 0, B = 0;
  if (nm >= 380 && nm < 440) { R = -(nm - 440) / 60; B = 1; }
  else if (nm >= 440 && nm < 490) { G = (nm - 440) / 50; B = 1; }
  else if (nm >= 490 && nm < 510) { G = 1; B = -(nm - 510) / 20; }
  else if (nm >= 510 && nm < 580) { R = (nm - 510) / 70; G = 1; }
  else if (nm >= 580 && nm < 645) { R = 1; G = -(nm - 645) / 65; }
  else if (nm >= 645 && nm <= 780) { R = 1; }
  let f = 1;
  if (nm >= 380 && nm < 420) f = 0.3 + 0.7 * (nm - 380) / 40;
  else if (nm > 700 && nm <= 780) f = 0.3 + 0.7 * (780 - nm) / 80;
  return [
    Math.round(255 * Math.pow(R * f, 0.8)),
    Math.round(255 * Math.pow(G * f, 0.8)),
    Math.round(255 * Math.pow(B * f, 0.8)),
  ];
}

/** Heurística: RGB → espectro estimado en 5 bandas. NO es inversión física. */
function rgbToApproxSpectrum(r, g, b) {
  const R = r / 255, G = g / 255, B = b / 255;
  return { 380: 0.20 * B, 450: B, 550: G, 650: R, 780: 0.30 * R };
}

/* ============================================================================
   SECCIÓN 1 — REGISTRO DE MÓDULOS
   ============================================================================ */
const ModuleRegistry = (() => {
  const modules = new Map();
  return {
    add(id, def) { modules.set(id, { id, ...def }); },
    get(id) { return modules.get(id); },
    all() { return [...modules.values()]; },
    clear() { modules.clear(); },
  };
})();

/* ============================================================================
   SECCIÓN 2 — ORQUESTADOR (compartido por todos los módulos)
   ============================================================================ */
class Orchestrator {
  constructor(registry, navEl, rootEl) {
    this.registry = registry; this.navEl = navEl; this.rootEl = rootEl;
    this.bus = new EventBus();
    this.ctx = { bus: this.bus, orchestrator: this };
    this.active = new Map();
  }
  boot() {
    for (const mod of this.registry.all()) {
      const label = document.createElement('label');
      label.className = 'module-toggle';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = mod.activoPorDefecto !== false;
      cb.dataset.id = mod.id;
      const span = document.createElement('span');
      span.textContent = mod.nombre;
      label.appendChild(cb); label.appendChild(span);
      label.dataset.id = mod.id;
      if (cb.checked) label.classList.add('active');
      cb.addEventListener('change', () => {
        label.classList.toggle('active', cb.checked);
        if (cb.checked) this.activate(mod.id);
        else this.deactivate(mod.id);
      });
      this.navEl.appendChild(label);
    }
    for (const mod of this.registry.all()) {
      if (mod.activoPorDefecto !== false) this.activate(mod.id);
    }
    this._startLoop();
  }
  activate(id) {
    if (this.active.has(id)) return;
    const mod = this.registry.get(id);
    if (!mod) return;
    for (const dep of (mod.depende || [])) {
      if (!this.active.has(dep)) {
        this.activate(dep);
        const cb = this.navEl.querySelector(`input[data-id="${dep}"]`);
        if (cb && !cb.checked) { cb.checked = true; cb.parentElement.classList.add('active'); }
      }
    }
    const container = document.createElement('div');
    container.className = 'module'; container.dataset.id = id;
    this.rootEl.appendChild(container);
    const localCtx = { ...this.ctx, container, deps: this._collectAPIs(mod.depende || []) };
    try { if (mod.mount) mod.mount(localCtx); }
    catch (e) {
      container.innerHTML = `<p style="color:#f66">Error al montar ${id}: ${e.message}</p>`;
      console.error(e); return;
    }
    this.active.set(id, {
      container, api: mod.api || null, frame: mod.frame || null,
      unmount: mod.unmount || null, ctx: localCtx,
    });
    this.bus.emit('module:activated', { id });
  }
  deactivate(id) {
    if (!this.active.has(id)) return;
    const entry = this.active.get(id);
    for (const other of this.registry.all()) {
      if (other.id === id) continue;
      if ((other.depende || []).includes(id) && this.active.has(other.id)) {
        console.warn(`No se puede desactivar ${id}: ${other.id} depende de él.`);
        return;
      }
    }
    if (entry.unmount) { try { entry.unmount(entry.ctx); } catch (e) { console.error(e); } }
    entry.container.remove();
    this.active.delete(id);
    this.bus.emit('module:deactivated', { id });
  }
  _collectAPIs(deps) {
    const apis = {};
    for (const dep of deps) {
      const e = this.active.get(dep);
      if (e && e.api) apis[dep] = e.api;
    }
    return apis;
  }
  _startLoop() {
    const loop = () => {
      for (const [, entry] of this.active) {
        if (entry.frame) { try { entry.frame(entry.ctx); } catch (e) { console.error('Frame error:', e); } }
      }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
}

/* ============================================================================
   SECCIÓN 3 — MÓDULO: em-motor (FDTD compartido)
   ============================================================================ */
(() => {
  class FDTD {
    constructor(nx, nz) {
      const n = nx * nz;
      this.nx = nx; this.nz = nz;
      this.ez = new Float32Array(n);
      this.hx = new Float32Array(n);
      this.hy = new Float32Array(n);
      this.eps = new Float32Array(n).fill(1);
      this.damp = new Float32Array(n);
      this.time = 0;
      this._buildSponge();
    }
    _buildSponge() {
      const { nx, nz } = this;
      const W = 18, MD = 0.12;
      for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) {
        const d = Math.min(i, nx - 1 - i, j, nz - 1 - j);
        if (d < W) { const t = (W - d) / W; this.damp[i + j * nx] = MD * t * t * t; }
      }
    }
    setEpsilon(fn) {
      for (let j = 0; j < this.nz; j++) for (let i = 0; i < this.nx; i++) {
        this.eps[i + j * this.nx] = fn(i, j);
      }
    }
    reset() { this.ez.fill(0); this.hx.fill(0); this.hy.fill(0); this.time = 0; }
    step(sourceFn, dt = 0.3535) {
      const { nx, nz, ez, hx, hy, eps, damp } = this;
      for (let j = 0; j < nz - 1; j++) for (let i = 0; i < nx; i++) {
        const idx = i + j * nx;
        hx[idx] -= dt * (ez[idx + nx] - ez[idx]);
      }
      for (let j = 0; j < nz; j++) for (let i = 0; i < nx - 1; i++) {
        const idx = i + j * nx;
        hy[idx] += dt * (ez[idx + 1] - ez[idx]);
      }
      for (let j = 1; j < nz - 1; j++) for (let i = 1; i < nx - 1; i++) {
        const idx = i + j * nx;
        ez[idx] += dt / eps[idx] * ((hy[idx] - hy[idx - 1]) - (hx[idx] - hx[idx - 1]));
        const d = damp[idx];
        if (d) { ez[idx] *= (1 - d); hx[idx] *= (1 - d); hy[idx] *= (1 - d); }
      }
      if (sourceFn) {
        const ci = (nx / 2) | 0, cj = (nz / 2) | 0;
        ez[ci + cj * nx] += sourceFn(this.time);
      }
      this.time += dt;
    }
  }
  const scenarios = {
    vacio() { return 1; },
    lamina(i, j, nx) { return (i > nx * 0.6 && i < nx * 0.75) ? 4 : 1; },
    prisma(i, j, nx, nz) {
      const x = i / nx, y = j / nz;
      if (x > 0.4 && x < 0.8 && y > 0.2 && y < 0.8) {
        const apex = 0.65, left = 0.4, right = 0.8;
        const h = 1 - Math.abs((x - apex) / (right - left));
        if (y > 0.5 - h * 0.4 && y < 0.5 + h * 0.4) return 4;
      }
      return 1;
    },
    lente(i, j, nx, nz) {
      const cx = nx * 0.65, cy = nz * 0.5;
      const d2 = (i - cx) ** 2 + (j - cy) ** 2;
      const R = Math.min(nx, nz) * 0.15;
      return d2 < R * R ? 4 : 1;
    },
  };
  function makeSource(freq) {
    const t0 = 3 / freq, tau = 1.2 / freq;
    return (t) => {
      const a = (t - t0) / tau;
      return Math.sin(2 * Math.PI * freq * (t - t0)) * Math.exp(-a * a);
    };
  }
  const NX = 110, NZ = 90;
  const WL_TABLE = {
    380: { freq: 0.065, eps: 4.7, label: 'UV' },
    450: { freq: 0.060, eps: 4.5, label: 'azul' },
    550: { freq: 0.050, eps: 4.0, label: 'verde' },
    650: { freq: 0.040, eps: 3.6, label: 'rojo' },
    780: { freq: 0.033, eps: 3.3, label: 'IR' },
  };
  const sims = [];
  let mode = 'mono', scenarioName = 'lamina', wavelengthNm = 550, running = true;
  function buildSims() {
    sims.length = 0;

(() => {
  let canvas, ctx2d, imageData, offscreen, offCtx;
  function ensureCanvas(w, h) {
    if (!canvas || canvas.width !== w || canvas.height !== h) {
      canvas.width = w; canvas.height = h;
      offscreen = document.createElement('canvas');
      offscreen.width = w; offscreen.height = h;
      offCtx = offscreen.getContext('2d');
      imageData = offCtx.createImageData(w, h);
    }
  }
  ModuleRegistry.add('em-color', {
    nombre: '🎨 Color (percepción humana)',
    depende: ['em-motor'], activoPorDefecto: true,
    mount(c) {
      c.container.innerHTML = `
        <h2>🎨 Color — de onda a percepción</h2>
        <div class="desc">
          El motor EM produce <em>frecuencias</em>. El <strong>color</strong> está en el ojo que
          mira. Este módulo aplica la conversión longitud de onda → RGB.
        </div>
        <canvas id="em-color-canvas"></canvas>
        <div class="canvas-toolbar"><button data-png="em-color-canvas">💾 Descargar PNG</button></div>
        <div class="info-line" id="color-info">Esperando datos del motor…</div>
      `;
      canvas = c.container.querySelector('#em-color-canvas');
      ctx2d = canvas.getContext('2d');
      c.container.querySelector('[data-png]').addEventListener('click', () => {
        const a = document.createElement('a');
        a.download = 'em-color.png'; a.href = canvas.toDataURL('image/png'); a.click();
      });
    },
    frame(c) {
      const motor = c.deps['em-motor'];
      if (!motor) return;
      const fields = motor.getFields();
      if (!fields.length) return;
      const visible = fields.filter(f => [450, 550, 650].includes(f.wavelength));
      const toDraw = visible.length > 0 ? visible : fields;
      ensureCanvas(toDraw[0].nx, toDraw[0].nz);
      const data = imageData.data;
      let maxV = 1e-20;
      for (const f of toDraw) for (let k = 0; k < f.field.length; k++) {
        const a = Math.abs(f.field[k]); if (a > maxV) maxV = a;
      }
      const inv = 1 / maxV;
      const N = toDraw[0].field.length;
      for (let k = 0; k < N; k++) {
        let r = 0, g = 0, b = 0;
        for (const f of toDraw) {
          const v = Math.min(1, Math.abs(f.field[k]) * inv);
          r += f.color[0] * v; g += f.color[1] * v; b += f.color[2] * v;
        }
        const p = k * 4;
        data[p] = Math.min(255, r); data[p+1] = Math.min(255, g);
        data[p+2] = Math.min(255, b); data[p+3] = 255;
      }
      offCtx.putImageData(imageData, 0, 0);
      ctx2d.imageSmoothingEnabled = true;
      ctx2d.drawImage(offscreen, 0, 0, canvas.width, canvas.height);
      const info = c.container.querySelector('#color-info');
      if (info) {
        const wls = toDraw.map(f => f.wavelength + 'nm').join(', ');
        info.textContent = `Longitudes visibles: ${wls} · modo motor: ${motor.getMode()}`;
      }
    },
  });
})();

/* ============================================================================
   SECCIÓN 8 — MÓDULO: em-fdtd (simulador EM completo con presets y CPML)
   ============================================================================ */
(() => {
  const EPS0 = 1, MU0 = 1, C0 = 1;
  class Medium {
    constructor({ epsR = 1, muR = 1, sigma = 0, pec = false, label = '' } = {}) {
      this.epsR = epsR; this.muR = muR; this.sigma = sigma; this.pec = pec; this.label = label;
      this.eps = epsR * EPS0; this.mu = muR * MU0;
    }
  }
  class Source { constructor(x, z, type, freq, amp) { this.x = x; this.z = z; this.type = type; this.freq = freq; this.amp = amp; } }
  class Probe {
    constructor(x, z, label = '') { this.x = x; this.z = z; this.label = label; this.ez = []; this.hmag = []; }
  }
  class SimConfig {
    constructor() {
      this.nx = 200; this.nz = 200; this.dx = 1; this.dz = 1;
      this.courant = 0.5; this.dt = 0.5 / Math.SQRT2;
      this.pmlCells = 20; this.pmlOrder = 3;
      this.source = null; this.probes = []; this.materials = null;
      this.time = 0; this.stepCount = 0; this.stepsPerFrame = 4;
    }
    updateDt() { this.dt = this.courant * Math.min(this.dx, this.dz) / (C0 * Math.SQRT2); }
  }
  const VACUUM = new Medium({ label: 'vacío' });
  const PEC = new Medium({ pec: true, label: 'PEC' });
  function buildMaterials(nx, nz, fn) {
    const arr = new Array(nx * nz);
    for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) arr[i + j * nx] = fn(i, j);
    return arr;
  }
  const MODEL_PRESETS = {
    freeSpace() {
      const c = new SimConfig();
      c.materials = buildMaterials(c.nx, c.nz, () => VACUUM);
      c.source = new Source(100, 100, 'softEz', 0.05, 1);
      c.probes = [new Probe(140, 100, 'x+40'), new Probe(100, 140, 'z+40')];
      return c;
    },
    dielectricSlab() {
      const c = new SimConfig();
      c.nx = 300; c.nz = 200;
      const diel = new Medium({ epsR: 4, label: 'dieléctrico ε=4' });
      c.materials = buildMaterials(c.nx, c.nz, (i) => (i >= 140 && i < 180) ? diel : VACUUM);
      c.source = new Source(60, 100, 'softEz', 0.05, 1);
      c.probes = [new Probe(100, 100, 'incidente'), new Probe(220, 100, 'transmitido'), new Probe(60, 140, 'reflejado')];
      return c;
    },
    waveguide() {
      const c = new SimConfig();
      c.nx = 400; c.nz = 120;
      c.materials = buildMaterials(c.nx, c.nz, (_, j) => (j < 15 || j >= 105) ? PEC : VACUUM);
      c.source = new Source(50, 60, 'softEz', 0.05, 1);
      c.probes = [new Probe(200, 60, 'x=200'), new Probe(320, 60, 'x=320')];
      return c;
    },
    photonicCrystal() {
      const c = new SimConfig();
      c.nx = 240; c.nz = 240;
      const rod = new Medium({ epsR: 11.4, label: 'varilla ε=11.4' });
      const a = 30, r = 8;
      c.materials = buildMaterials(c.nx, c.nz, (i, j) => {
        const px = Math.round((i - 120) / a) * a + 120;
        const pz = Math.round((j - 120) / a) * a + 120;
        const dx = i - px, dz = j - pz;
        return (dx * dx + dz * dz < r * r) ? rod : VACUUM;
      });
      c.source = new Source(120, 60, 'softEz', 0.06, 1);
      c.probes = [new Probe(120, 80, 'cerca'), new Probe(120, 140, 'transmitido')];
      return c;
    },
  };

  class FDTDEngine {
    init(config) {
      this.config = config; this._allocate();
      this._buildMaterialCoefficients(); this._buildPMLCoefficients();
      this._buildSourceFunction(); this._resetFields();
    }
    _allocate() {
      const n = this.config.nx * this.config.nz;
      this.ez = new Float32Array(n); this.hx = new Float32Array(n); this.hy = new Float32Array(n);
      this.psi_ez_x = new Float32Array(n); this.psi_ez_y = new Float32Array(n);
      this.psi_hx_y = new Float32Array(n); this.psi_hy_x = new Float32Array(n);
      this.ca = new Float32Array(n); this.cb = new Float32Array(n);
      this.mu_hx = new Float32Array(n); this.mu_hy = new Float32Array(n);
      this.pecMask = new Uint8Array(n);
    }
    _buildMaterialCoefficients() {
      const { nx, nz, dt, materials } = this.config;
      for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) {
        const idx = i + j * nx; const med = materials[idx];
        const denom = 1 + med.sigma * dt / (2 * med.eps);
        this.ca[idx] = (1 - med.sigma * dt / (2 * med.eps)) / denom;
        this.cb[idx] = (dt / med.eps) / denom;
        const medBelow = (j + 1 < nz) ? materials[i + (j + 1) * nx] : med;
        this.mu_hx[idx] = 0.5 * (med.mu + medBelow.mu);
        const medRight = (i + 1 < nx) ? materials[(i + 1) + j * nx] : med;
        this.mu_hy[idx] = 0.5 * (med.mu + medRight.mu);
        this.pecMask[idx] = med.pec ? 1 : 0;
      }
    }
    _buildPMLCoefficients() {
      const { nx, nz, dt, pmlCells: L, pmlOrder: m } = this.config;
      const sigmaMax = -(m + 1) * Math.log(1e-6) / (2 * L);
      this.bx = new Float32Array(nx); this.cx = new Float32Array(nx);
      this.by = new Float32Array(nz); this.cy = new Float32Array(nz);
      for (let i = 0; i < nx; i++) {
        let s = 0;
        if (i < L) s = sigmaMax * Math.pow((L - i) / L, m);
        else if (i >= nx - L) s = sigmaMax * Math.pow((i - (nx - L - 1)) / L, m);
        this.bx[i] = Math.exp(-s * dt); this.cx[i] = this.bx[i] - 1;
      }
      for (let j = 0; j < nz; j++) {
        let s = 0;
        if (j < L) s = sigmaMax * Math.pow((L - j) / L, m);
        else if (j >= nz - L) s = sigmaMax * Math.pow((j - (nz - L - 1)) / L, m);
        this.by[j] = Math.exp(-s * dt); this.cy[j] = this.by[j] - 1;
      }
    }
    _buildSourceFunction() {
      const src = this.config.source;
      if (!src) { this.sourceFunc = null; return; }
      const f = src.freq, t0 = 3 / f, tau = 1.2 / f;
      this.sourceFunc = (t) => {
        const arg = (t - t0) / tau;
        return src.amp * Math.sin(2 * Math.PI * f * (t - t0)) * Math.exp(-arg * arg);
      };
    }
    _resetFields() {
      this.ez.fill(0); this.hx.fill(0); this.hy.fill(0);
      this.psi_ez_x.fill(0); this.psi_ez_y.fill(0);
      this.psi_hx_y.fill(0); this.psi_hy_x.fill(0);
      this.config.time = 0; this.config.stepCount = 0;
      this.config.probes.forEach(p => { p.ez = []; p.hmag = []; });
    }
    step() {
      const cfg = this.config;
      const { nx, nz, dt, source, probes } = cfg;
      const dx = cfg.dx, dz = cfg.dz, t = cfg.time;
      for (let j = 0; j < nz - 1; j++) for (let i = 0; i < nx; i++) {
        const idx = i + j * nx;
        const dEz_dz = (this.ez[idx + nx] - this.ez[idx]) / dz;
        const psi = this.by[j] * this.psi_hx_y[idx] + this.cy[j] * dEz_dz;
        this.psi_hx_y[idx] = psi;
        this.hx[idx] -= (dt / this.mu_hx[idx]) * (dEz_dz + psi);
      }
      for (let j = 0; j < nz; j++) for (let i = 0; i < nx - 1; i++) {
        const idx = i + j * nx;
        const dEz_dx = (this.ez[idx + 1] - this.ez[idx]) / dx;
        const psi = this.bx[i] * this.psi_hy_x[idx] + this.cx[i] * dEz_dx;
        this.psi_hy_x[idx] = psi;
        this.hy[idx] += (dt / this.mu_hy[idx]) * (dEz_dx + psi);
      }
      for (let j = 1; j < nz - 1; j++) for (let i = 1; i < nx - 1; i++) {
        const idx = i + j * nx;
        const dHy_dx = (this.hy[idx] - this.hy[idx - 1]) / dx;
        const dHx_dz = (this.hx[idx] - this.hx[idx - nx]) / dz;
        const psiX = this.bx[i] * this.psi_ez_x[idx] + this.cx[i] * dHy_dx;
        const psiY = this.by[j] * this.psi_ez_y[idx] + this.cy[j] * dHx_dz;
        this.psi_ez_x[idx] = psiX; this.psi_ez_y[idx] = psiY;
        let val = this.ca[idx] * this.ez[idx] + this.cb[idx] * ((dHy_dx + psiX) - (dHx_dz + psiY));
        if (this.pecMask[idx]) val = 0;
        this.ez[idx] = val;
      }
      if (source && this.sourceFunc) {
        const val = this.sourceFunc(t);
        if (source.type === 'planeWave') {
          const jLine = cfg.pmlCells + 2;
          for (let i = 0; i < nx; i++) this.ez[i + jLine * nx] += val;
        } else {
          const si = Math.round(source.x), sj = Math.round(source.z);
          if (si >= 1 && si < nx - 1 && sj >= 1 && sj < nz - 1) {
            const idx = si + sj * nx;
            if (source.type === 'hardEz') this.ez[idx] = val;
            else this.ez[idx] += val;
          }
        }
      }
      for (let k = 0; k < probes.length; k++) {
        const p = probes[k];
        const pi = Math.round(p.x), pj = Math.round(p.z);
        if (pi >= 0 && pi < nx && pj >= 0 && pj < nz) {
          const idx = pi + pj * nx;
          p.ez.push(this.ez[idx]);
          p.hmag.push(Math.sqrt(this.hx[idx] ** 2 + this.hy[idx] ** 2));
          if (p.ez.length > 4000) { p.ez.splice(0, 2000); p.hmag.splice(0, 2000); }
        }
      }
      cfg.time += dt; cfg.stepCount++;
    }
    getFieldData() { return this.ez; }
    getProbeData() { return this.config.probes.map(p => Float32Array.from(p.ez)); }
  }

  class FieldVisualizer {
    constructor(canvas) { this.canvas = canvas; this.ctx = canvas.getContext('2d'); this.offscreen = null; this.offCtx = null; this.imageData = null; }
    drawField(data, nx, nz, config) {
      if (!this.offscreen || this.offscreen.width !== nx || this.offscreen.height !== nz) {
        this.offscreen = document.createElement('canvas');
        this.offscreen.width = nx; this.offscreen.height = nz;
        this.offCtx = this.offscreen.getContext('2d');
        this.imageData = this.offCtx.createImageData(nx, nz);
      }
      const img = this.imageData.data;
      let maxVal = 1e-20;
      for (let k = 0; k < data.length; k++) { const a = Math.abs(data[k]); if (a > maxVal) maxVal = a; }
      const inv = 1 / maxVal;
      for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) {
        const idx = i + j * nx; const med = config.materials[idx];
        const p = idx * 4;
        let r, g, b;
        if (med.pec) { r = 55; g = 55; b = 65; }
        else {
          const val = data[idx] * inv;
          const col = this._divergingColor(val);
          const tint = med.epsR > 1.5;
          r = Math.min(255, col[0] + (tint ? 10 : 0));
          g = Math.min(255, col[1] + (tint ? 5 : 0));
          b = Math.min(255, col[2] + (tint ? 45 : 0));
        }
        img[p] = r; img[p+1] = g; img[p+2] = b; img[p+3] = 255;
      }
      this.offCtx.putImageData(this.imageData, 0, 0);
      const ctx = this.ctx;
      const W = this.canvas.width, H = this.canvas.height;
      const aspect = nx / nz, canvasAspect = W / H;
      let dw, dh, dx0, dy0;
      if (aspect > canvasAspect) { dw = W; dh = W / aspect; dx0 = 0; dy0 = (H - dh) / 2; }
      else { dh = H; dw = H * aspect; dx0 = (W - dw) / 2; dy0 = 0; }
      ctx.fillStyle = '#04040a'; ctx.fillRect(0, 0, W, H);
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(this.offscreen, dx0, dy0, dw, dh);
      const toCanvas = (x, z) => ({
        cx: dx0 + (x / nx) * dw, cy: dy0 + (z / nz) * dh,
      });
      if (config.source && config.source.type !== 'planeWave') {
        const { cx, cy } = toCanvas(config.source.x, config.source.z);
        ctx.fillStyle = '#ff4466';
        ctx.beginPath(); ctx.arc(cx, cy, 5, 0, 2 * Math.PI); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
      }
      ctx.fillStyle = '#22ddff'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
      config.probes.forEach(p => {
        const { cx, cy } = toCanvas(p.x, p.z);
        ctx.beginPath(); ctx.arc(cx, cy, 4, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
      });
    }
    _divergingColor(t) {
      if (t >= 0) { const s = Math.min(1, t); return [Math.floor(5 + 250*s), Math.floor(5 + 75*s), Math.floor(15 + 5*s)]; }
      const s = Math.min(1, -t); return [Math.floor(5 + 15*s), Math.floor(5 + 75*s), Math.floor(15 + 240*s)];
    }
  }

  class ProbeRenderer {
    constructor(container) { this.container = container; }
    draw(traces, probes) {
      this.container.innerHTML = '';
      traces.forEach((trace, idx) => {
        const card = document.createElement('div');
        card.className = 'probe-card';
        const canvas = document.createElement('canvas');
        canvas.width = 240; canvas.height = 70;
        card.appendChild(canvas);
        const lbl = document.createElement('div');
        lbl.style.cssText = 'font-size:0.75rem;color:#aaccff;margin-top:2px;';
        const p = probes[idx];
        lbl.textContent = `Sonda ${idx+1}${p && p.label ? ' · ' + p.label : ''} (${trace.length})`;
        card.appendChild(lbl);
        this.container.appendChild(card);
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#04040a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        if (trace.length < 2) return;
        let mx = 1e-12;
        for (let k = 0; k < trace.length; k++) { const a = Math.abs(trace[k]); if (a > mx) mx = a; }
        const yScale = (canvas.height * 0.4) / mx;
        ctx.strokeStyle = 'rgba(150,150,200,0.25)';
        ctx.beginPath(); ctx.moveTo(0, canvas.height/2); ctx.lineTo(canvas.width, canvas.height/2); ctx.stroke();
        ctx.strokeStyle = '#44ddff'; ctx.lineWidth = 1; ctx.beginPath();
        const N = trace.length, startIdx = Math.max(0, N - canvas.width), shown = N - startIdx;
        for (let k = 0; k < shown; k++) {
          const x = (k / Math.max(1, shown - 1)) * canvas.width;
          const y = canvas.height/2 - trace[startIdx + k] * yScale;
          if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
      });
    }
  }

        </div>

        </div>
        <div class="status ok" id="statusMsg">Listo. Pulsa Iniciar.</div>
        <canvas id="wavefieldCanvas" width="720" height="480"></canvas>

        c.container.querySelector('#stepBtn').disabled = false;
      });
      c.container.querySelector('#stepBtn').addEventListener('click', () => { engine.step(); renderAll(); });
      c.container.querySelector('#resetBtn').addEventListener('click', () => {
        stopSim(); engine._resetFields(); renderAll();
        c.container.querySelector('#startBtn').disabled = false;
        c.container.querySelector('#pauseBtn').disabled = true;
        c.container.querySelector('#stepBtn').disabled = false;
      });
      c.container.querySelector('#listenBtn').addEventListener('click', async () => {
        stopSim();
        c.container.querySelector('#startBtn').disabled = false;
        c.container.querySelector('#pauseBtn').disabled = true;
        c.container.querySelector('#stepBtn').disabled = false;
        engine._resetFields();
        const duration = 0.25, steps = Math.floor(duration / cfg.dt);
        const chunkSize = 400;
        for (let done = 0; done < steps; done += chunkSize) {
          const end = Math.min(done + chunkSize, steps);
          for (let i = done; i < end; i++) engine.step();
          await new Promise(r => setTimeout(r, 0));
        }
        const trace = Float32Array.from(cfg.receivers[0].trace);
        const fs = cfg.sampleRate, nyq = fs / 2;
        const abs = Math.min(1, Math.max(0, cfg.medium.absorption));
        const cutoff = Math.max(500, nyq * (1 - abs * 0.9));

        renderAll();
      });
      renderMedium(); renderAll();
      c._acoustic = { stopSim, sonifier };
    },
    unmount(c) {
      if (c._acoustic?.stopSim) c._acoustic.stopSim();
      if (c._acoustic?.sonifier?.ctx) c._acoustic.sonifier.ctx.close().catch(() => {});
    },
  });
})();

/* ============================================================================
   SECCIÓN 10 — MÓDULO: sísmico (ondas elásticas en el manto)
   ============================================================================ */
(() => {
  class MediumProperties {
    constructor({ vp, vs, rho, q }) {
      this.vp = vp; this.vs = vs; this.rho = rho; this.q = q;
      this.lambda = rho * (vp * vp - 2 * vs * vs);
      this.mu = rho * vs * vs;
    }
  }
  class Layer { constructor(depth, medium) { this.depth = depth; this.medium = medium; } }
  class Source { constructor(x, z, type, freq, amp) { Object.assign(this, { x, z, type, freq, amp }); } }
  class Receiver { constructor(x, z) { this.x = x; this.z = z; this.data = []; } }
  class SimulationConfig {
    constructor() {
      this.nx = 200; this.nz = 100; this.dx = 10; this.dz = 10; this.dt = 0.0005;
      this.layers = []; this.source = null; this.receivers = []; this.mantleProfile = null;
      this.boundaryConditions = { top: 'free', left: 'absorbing', right: 'absorbing', bottom: 'absorbing' };
      this.time = 0; this.stepCount = 0; this.stepsPerFrame = 1;
    }
    updateDt() {
      const maxVp = this.mantleProfile ? Math.max(...this.mantleProfile.vps) * 1000
        : Math.max(...this.layers.map(l => l.medium.vp), 1000);
      this.dt = 0.4 * Math.min(this.dx, this.dz) / maxVp;
    }
  }
  class MantleProfile {
    constructor(depths, vps, vss, rhos, qps = null, qss = null) {
      this.depths = depths; this.vps = vps; this.vss = vss; this.rhos = rhos;
      this.qps = qps || vps.map(() => 300); this.qss = qss || vss.map(() => 150);
    }
    getPropertiesAtDepth(zKm) {
      const d = this.depths;
      if (zKm <= d[0]) return this._make(0);
      if (zKm >= d[d.length - 1]) return this._make(d.length - 1);
      for (let i = 0; i < d.length - 1; i++) {
        if (zKm >= d[i] && zKm <= d[i + 1]) {
          const t = (zKm - d[i]) / (d[i + 1] - d[i]);
          return new MediumProperties({
            vp: (this.vps[i] + t * (this.vps[i + 1] - this.vps[i])) * 1000,
            vs: (this.vss[i] + t * (this.vss[i + 1] - this.vss[i])) * 1000,
            rho: (this.rhos[i] + t * (this.rhos[i + 1] - this.rhos[i])) * 1000,
            q: this.qps[i] + t * (this.qps[i + 1] - this.qps[i]),
          });
        }
      }
      return new MediumProperties({ vp: 8000, vs: 4500, rho: 3300, q: 300 });
    }
    _make(idx) {
      return new MediumProperties({
        vp: this.vps[idx] * 1000, vs: this.vss[idx] * 1000,
        rho: this.rhos[idx] * 1000, q: this.qps[idx],
      });
    }
  }
  const PREM_SIMPLIFIED = new MantleProfile(
    [0,35,100,220,410,520,660,800,1000,1500,2000,2500,2890],
    [5.8,8.0,8.1,8.5,9.0,9.7,10.2,10.8,11.2,11.8,12.4,13.0,13.7],
    [3.2,4.5,4.5,4.7,4.9,5.3,5.6,5.9,6.1,6.4,6.8,7.1,7.3],
    [2.6,3.3,3.35,3.4,3.5,3.7,3.9,4.1,4.3,4.6,4.9,5.2,5.6],
    [300,400,300,200,300,300,400,500,600,700,800,900,1000],
    [150,200,150,100,150,150,200,250,300,350,400,450,500]
  );
  class SeismicEngine {
    init(config) {
      this.config = config;
      this._buildGrid(); this._buildMaterialArrays();
      this._buildBoundaryDamping(); this._buildSourceTimeFunction(); this._resetFields();
    }
    _buildGrid() {
      const { nx, nz } = this.config;
      this.vx = new Float32Array(nx * nz); this.vz = new Float32Array(nx * nz);
      this.sxx = new Float32Array(nx * nz); this.szz = new Float32Array(nx * nz);
      this.sxz = new Float32Array(nx * nz);
      this.rho_vx = new Float32Array(nx * nz); this.rho_vz = new Float32Array(nx * nz);
      this.lambda2mu = new Float32Array(nx * nz); this.lambda = new Float32Array(nx * nz);
      this.mu_sxz = new Float32Array(nx * nz); this.damping = new Float32Array(nx * nz);
    }
    _buildMaterialArrays() {
      const { nx, nz, dz, layers, mantleProfile } = this.config;
      const mediumAtCell = new Array(nx * nz);
      for (let j = 0; j < nz; j++) {
        const zM = j * dz, zKm = zM / 1000;
        let medium;
        if (mantleProfile) medium = mantleProfile.getPropertiesAtDepth(zKm);
        else {
          medium = layers[0]?.medium || new MediumProperties({ vp: 5500, vs: 3200, rho: 2700, q: 100 });
          for (let l = layers.length - 1; l >= 0; l--) {
            if (zM >= layers[l].depth) { medium = layers[l].medium; break; }
          }
        }
        for (let i = 0; i < nx; i++) mediumAtCell[i + j * nx] = medium;
      }
      for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) {
        const idx = i + j * nx; const med = mediumAtCell[idx];
        const lambda = med.lambda, mu = med.mu, rho = med.rho;
        const medRight = mediumAtCell[Math.min(i + 1, nx - 1) + j * nx];
        this.rho_vx[idx] = 0.5 * (rho + medRight.rho);
        this.lambda2mu[idx] = 0.5 * (lambda + medRight.lambda + 2 * (mu + medRight.mu));
        const medBelow = mediumAtCell[i + Math.min(j + 1, nz - 1) * nx];
        this.rho_vz[idx] = 0.5 * (rho + medBelow.rho);
        const medRD = mediumAtCell[Math.min(i+1, nx-1) + j * nx];
        const medRB = mediumAtCell[i + Math.min(j+1, nz-1) * nx];
        const medRBD = mediumAtCell[Math.min(i+1, nx-1) + Math.min(j+1, nz-1) * nx];
        this.mu_sxz[idx] = 0.25 * (mu + medRD.mu + medRB.mu + medRBD.mu);
        this.lambda[idx] = lambda;
      }
    }
    _buildBoundaryDamping() {
      const { nx, nz, boundaryConditions } = this.config;
      const dw = Math.min(20, Math.floor(Math.min(nx, nz) * 0.1));
      for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) {
        let damp = 0;
        if (boundaryConditions.left === 'absorbing' && i < dw)
          damp = Math.max(damp, 0.1 * (1 - i / dw));
        if (boundaryConditions.right === 'absorbing' && i > nx - dw - 1)
          damp = Math.max(damp, 0.1 * (1 - (nx - 1 - i) / dw));
        if (boundaryConditions.bottom === 'absorbing' && j > nz - dw - 1)
          damp = Math.max(damp, 0.1 * (1 - (nz - 1 - j) / dw));
        this.damping[i + j * nx] = damp;
      }
    }
    _buildSourceTimeFunction() {
      const src = this.config.source; if (!src) return;
      const f = src.freq, t0 = 1 / f;
      this.sourceTimeFunction = (t) => {
        const tau = Math.PI * f * (t - t0);
        return (1 - 2 * tau * tau) * Math.exp(-tau * tau) * src.amp;
      };
    }
    _resetFields() {
      this.vx.fill(0); this.vz.fill(0);
      this.sxx.fill(0); this.szz.fill(0); this.sxz.fill(0);
      this.config.time = 0; this.config.stepCount = 0;
      this.config.receivers.forEach(r => r.data = []);
    }
    step() {
      const { nx, nz, dx, dz, dt, source, receivers } = this.config;
      const t = this.config.time;
      for (let j = 1; j < nz - 1; j++) for (let i = 1; i < nx - 1; i++) {
        const idx = i + j * nx, idx_im1 = (i - 1) + j * nx, idx_jm1 = i + (j - 1) * nx;
        this.vx[idx] += dt * ((this.sxx[idx] - this.sxx[idx_im1]) / dx +
                              (this.sxz[idx] - this.sxz[idx_jm1]) / dz) / this.rho_vx[idx];
        this.vz[idx] += dt * ((this.sxz[idx] - this.sxz[idx_im1]) / dx +
                              (this.szz[idx] - this.szz[idx_jm1]) / dz) / this.rho_vz[idx];
        const damp = this.damping[idx];
        if (damp > 0) { this.vx[idx] *= (1 - damp); this.vz[idx] *= (1 - damp); }
      }
      if (source && this.sourceTimeFunction) {
        const sx = Math.floor(source.x / dx), sz = Math.floor(source.z / dz);
        if (sx >= 0 && sx < nx && sz >= 0 && sz < nz) {
          const idx = sx + sz * nx, val = this.sourceTimeFunction(t);
          if (source.type === 'explosion') { this.sxx[idx] += val; this.szz[idx] += val; }
          else if (source.type === 'verticalForce') this.vz[idx] += val;
          else if (source.type === 'horizontalForce') this.vx[idx] += val;
        }
      }
      for (let j = 1; j < nz - 1; j++) for (let i = 1; i < nx - 1; i++) {
        const idx = i + j * nx;
        const idx_ip1 = (i + 1) + j * nx, idx_jp1 = i + (j + 1) * nx;
        this.sxx[idx] += dt * (this.lambda2mu[idx] * (this.vx[idx_ip1] - this.vx[idx]) / dx +
                                this.lambda[idx] * (this.vz[idx_jp1] - this.vz[idx]) / dz);
        this.szz[idx] += dt * (this.lambda[idx] * (this.vx[idx_ip1] - this.vx[idx]) / dx +
                                this.lambda2mu[idx] * (this.vz[idx_jp1] - this.vz[idx]) / dz);
        this.sxz[idx] += dt * this.mu_sxz[idx] * ((this.vx[idx_jp1] - this.vx[idx]) / dz +
                                                   (this.vz[idx_ip1] - this.vz[idx]) / dx);
      }
      if (this.config.boundaryConditions.top === 'free') {
        for (let i = 0; i < nx; i++) { this.szz[i] = 0; this.sxz[i] = 0; }
      }
      receivers.forEach(rec => {
        const rx = Math.floor(rec.x / dx), rz = Math.floor(rec.z / dz);
        if (rx >= 0 && rx < nx && rz >= 0 && rz < nz) {
          const idx = rx + rz * nx;
          rec.data.push(Math.sqrt(this.vx[idx] ** 2 + this.vz[idx] ** 2));
        }
      });
      this.config.time += dt; this.config.stepCount++;
    }
    getFieldData() {
      const { nx, nz } = this.config;
      const data = new Float32Array(nx * nz);
      for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) {
        const idx = i + j * nx;
        data[idx] = Math.sqrt(this.vx[idx] ** 2 + this.vz[idx] ** 2);
      }
      return data;
    }
  }
  class SeismicVisualizer {
    constructor(canvas) { this.canvas = canvas; this.ctx = canvas.getContext('2d'); this.imageData = null; }
    drawField(data, nx, nz, config) {
      const ctx = this.ctx, canvas = this.canvas;
      const scaleX = canvas.width / nx, scaleY = canvas.height / nz;
      if (!this.imageData || this.imageData.width !== canvas.width)
        this.imageData = ctx.createImageData(canvas.width, canvas.height);
      const imgData = this.imageData.data;
      let maxVal = 0;
      for (let i = 0; i < data.length; i++) if (data[i] > maxVal) maxVal = data[i];
      if (maxVal === 0) maxVal = 1;
      for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) {
        const idx = i + j * nx;
        const norm = Math.min(1, data[idx] / maxVal);
        const [r, g, b] = this._hotColor(norm);
        const x0 = Math.floor(i * scaleX), y0 = Math.floor(j * scaleY);
        const x1 = Math.floor((i + 1) * scaleX), y1 = Math.floor((j + 1) * scaleY);
        for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
          const p = (y * canvas.width + x) * 4;
          imgData[p] = r; imgData[p+1] = g; imgData[p+2] = b; imgData[p+3] = 255;
        }
      }
      ctx.putImageData(this.imageData, 0, 0);
      if (config.source) {
        const sx = config.source.x / (nx * config.dx);
        const sz = config.source.z / (nz * config.dz);
        ctx.fillStyle = '#00ffff';
        ctx.beginPath(); ctx.arc(sx * canvas.width, sz * canvas.height, 4, 0, 2*Math.PI); ctx.fill();
      }
      config.receivers.forEach(rec => {
        const rx = rec.x / (nx * config.dx), rz = rec.z / (nz * config.dz);
        ctx.fillStyle = '#00ccff';
        ctx.beginPath(); ctx.arc(rx * canvas.width, rz * canvas.height, 3, 0, 2*Math.PI); ctx.fill();
      });
    }
    _hotColor(t) {
      const r = Math.min(255, Math.floor(255 * Math.max(0, Math.min(1, t * 3))));
      const g = Math.min(255, Math.floor(255 * Math.max(0, Math.min(1, t * 3 - 1))));
      const b = Math.min(255, Math.floor(255 * Math.max(0, Math.min(1, t * 3 - 2))));
      return [r, g, b];
    }
  }
  class SeismogramRenderer {
    constructor(container) { this.container = container; }

        for (let i = 0; i < trace.length; i++) {
          const x = (i / trace.length) * canvas.width;
          const y = canvas.height / 2 - trace[i] * yScale;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.fillStyle = '#aaccff'; ctx.font = '10px sans-serif';
        ctx.fillText(`Rec ${idx+1}`, 5, 10);
      });
    }
  }

  ModuleRegistry.add('sismico', {
    nombre: '🌍 Sísmico (manto terrestre)',
    depende: [], activoPorDefecto: false,
    mount(c) {

          config.stepsPerFrame = 1;

      };

          animId = requestAnimationFrame(loop);
        };
        animId = requestAnimationFrame(loop);
      };
      const stopSim = () => { running = false; if (animId) cancelAnimationFrame(animId); };

      c.container.querySelector('#modelSelect').addEventListener('change', (e) => applyModel(e.target.value));
      c.container.querySelector('#sourceType').addEventListener('change', (e) => {

        c.container.querySelector('#pauseBtn').disabled = true;

      c._sismico = { stopSim };

      if (c._sismico?.stopSim) c._sismico.stopSim();
    },
  });
})();

/* ============================================================================
   SECCIÓN 11 — TESTS
   ============================================================================ */
function runTests() {
  const results = [];
  const test = (name, fn) => {
    try { fn(); results.push({ name, ok: true }); }
    catch (e) { results.push({ name, ok: false, error: e.message }); }
  };
  const assert = (cond, msg) => { if (!cond) throw new Error(msg); };
  const approx = (a, b, tol, msg) => {
    if (Math.abs(a - b) > tol) throw new Error(`${msg || ''}: esperado ${b}±${tol}, obtenido ${a}`);
  };

  // --- EventBus ---
  test('EventBus: on/emit recibe payload', () => {
    const bus = new EventBus(); let received = null;
    bus.on('evt', (p) => { received = p; });
    bus.emit('evt', { x: 42 });
    assert(received && received.x === 42, 'payload no recibido');
  });
  test('EventBus: off desuscribe', () => {
    const bus = new EventBus(); let count = 0;
    const cb = () => { count++; };
    bus.on('evt', cb); bus.emit('evt'); bus.off('evt', cb); bus.emit('evt');
    assert(count === 1, `esperado 1, recibido ${count}`);
  });

  // --- wavelengthToRGB ---
  test('wavelengthToRGB: 550nm verde dominante', () => {
    const [r, g, b] = wavelengthToRGB(550);
    assert(g > r && g > b, `no dominante verde: ${r},${g},${b}`);
  });
  test('wavelengthToRGB: 650nm rojo dominante', () => {
    const [r, g, b] = wavelengthToRGB(650);
    assert(r > g && r > b, `no dominante rojo`);
  });
  test('wavelengthToRGB: 450nm azul dominante', () => {
    const [r, g, b] = wavelengthToRGB(450);
    assert(b > r && b > g, `no dominante azul`);
  });

  // --- rgbToApproxSpectrum ---
  test('rgbToApproxSpectrum: rojo puro → 650 y algo en 780', () => {
    const s = rgbToApproxSpectrum(255, 0, 0);
    assert(s[650] > 0.9 && s[780] > 0.2 && s[450] < 0.1 && s[550] < 0.1, 'mal reparto');
  });
  test('rgbToApproxSpectrum: verde puro → 550', () => {
    const s = rgbToApproxSpectrum(0, 255, 0);
    assert(s[550] > 0.9 && s[650] < 0.1 && s[450] < 0.1, 'mal reparto');
  });
  test('rgbToApproxSpectrum: azul puro → 450 y algo en 380', () => {
    const s = rgbToApproxSpectrum(0, 0, 255);
    assert(s[450] > 0.9 && s[380] > 0.1 && s[650] < 0.1, 'mal reparto');
  });
  test('rgbToApproxSpectrum: blanco → todas las bandas', () => {
    const s = rgbToApproxSpectrum(255, 255, 255);
    assert(s[380] > 0.1 && s[450] > 0.9 && s[550] > 0.9 && s[650] > 0.9, 'blanco no cubre');
  });
  test('rgbToApproxSpectrum: negro → cero', () => {
    const s = rgbToApproxSpectrum(0, 0, 0);
    for (const k in s) assert(s[k] === 0, `banda ${k} no es 0`);
  });

  // --- ModuleRegistry ---
  test('ModuleRegistry: add/get/all/clear', () => {
    const saved = [...ModuleRegistry.all()];
    ModuleRegistry.clear();
    ModuleRegistry.add('test-a', { nombre: 'A' });
    assert(ModuleRegistry.all().length === 1, 'no hay 1 módulo');
    assert(ModuleRegistry.get('test-a').nombre === 'A', 'get falla');
    assert(ModuleRegistry.get('no-existe') === undefined, 'get debería ser undefined');
    ModuleRegistry.clear();
    for (const m of saved) ModuleRegistry.add(m.id, m);
  });

  // --- Módulos registrados ---
  const REQUIRED = ['em-motor', 'em-color', 'percepcion', 'ojo-animal', 'foto-animal',
                    'em-fdtd', 'acustico', 'sismico'];
  for (const id of REQUIRED) {
    test(`Módulo ${id} registrado`, () => {
      assert(ModuleRegistry.get(id), `${id} no registrado`);
    });
  }
  test('em-color depende de em-motor', () => {
    const mod = ModuleRegistry.get('em-color');
    assert(mod.depende.includes('em-motor'), 'falta dependencia');
  });
  test('ojo-animal depende de em-motor', () => {
    const mod = ModuleRegistry.get('ojo-animal');
    assert(mod.depende.includes('em-motor'), 'falta dependencia');
    assert(typeof mod.api.getAnimals === 'function', 'getAnimals ausente');
  });
  test('foto-animal es autónomo y expone api', () => {
    const mod = ModuleRegistry.get('foto-animal');
    assert((mod.depende || []).length === 0, 'no debería tener dependencias');
    assert(typeof mod.api.getAnimals === 'function', 'getAnimals ausente');
    assert(typeof mod.api.hasImage === 'function', 'hasImage ausente');
  });

  // --- Tabla de animales ---
  test('Tabla ANIMALS: al menos 10 animales', () => {
    assert(Object.keys(ANIMALS).length >= 10, `solo hay ${Object.keys(ANIMALS).length}`);
  });
  test('Cada animal tiene nombre, canales, rgb y nota', () => {
    for (const id in ANIMALS) {
      const a = ANIMALS[id];
      assert(a.nombre, `${id} sin nombre`);
      assert(a.channels && a.channels.length > 0, `${id} sin canales`);
      assert(a.note, `${id} sin nota`);
      for (const ch of a.channels) {
        assert(ch.name && ch.rgb && ch.rgb.length === 3, `${id}/${ch.name} sin rgb`);
        const sum = Object.values(ch.weights || {}).reduce((a, b) => a + b, 0);
        assert(sum > 0, `${id}/${ch.name} sin peso`);
      }
    }
  });

  // --- Física acústica (duplicada aquí como verificación cruzada) ---
  test('Acústico: Tierra c ≈ 343 m/s', () => {
    const c = Math.sqrt(1.4 * 8.314 * 293 / 0.029);
    approx(c, 343, 5, 'c Tierra');
  });
  test('Acústico: Marte c ≈ 240 m/s', () => {
    const c = Math.sqrt(1.3 * 8.314 * 210 / 0.044);
    approx(c, 240, 15, 'c Marte');
  });

  // --- Física EM (unidades normalizadas) ---
  test('EM: dt ≤ S·dx/(c·√2) para Courant 0.5', () => {
    const S = 0.5, dx = 1, c = 1;
    const dt = S * dx / (c * Math.SQRT2);
    assert(dt <= 1 / Math.SQRT2, 'dt viola CFL');
  });

  // --- Estructura del Orchestrator ---
  test('Orchestrator: existe la clase y arranca', () => {
    assert(typeof Orchestrator === 'function', 'Orchestrator no definido');
  });

  const okCount = results.filter(r => r.ok).length;
  const failCount = results.length - okCount;
  console.log(`\n=== TESTS: ${okCount}/${results.length} OK ===`);
  results.forEach(r => {
    if (r.ok) console.log(`✅ ${r.name}`);
    else console.error(`❌ ${r.name}: ${r.error}`);
  });
  console.log('=== Fin de tests ===\n');

  const panel = document.getElementById('test-results');
  const list = document.getElementById('test-list');
  if (panel && list) {
    panel.style.display = 'block';
    list.innerHTML = results.map(r =>
      `<div class="${r.ok ? 'test-ok' : 'test-fail'}">${r.ok ? '✅' : '❌'} ${r.name}${r.ok ? '' : ' — ' + r.error}</div>`
    ).join('') + `<div style="margin-top:8px;color:#aaccff;">Total: ${okCount}/${results.length} OK</div>`;
  }
  return { ok: okCount, fail: failCount, results };
}

/* ============================================================================
   SECCIÓN 12 — ARRANQUE
   ============================================================================ */
window.addEventListener('load', () => {
  runTests();
  const nav = document.getElementById('module-nav');
  const root = document.getElementById('modules-root');
  const orchestrator = new Orchestrator(ModuleRegistry, nav, root);
  orchestrator.boot();
});
</script>
</body>
</html>
